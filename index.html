<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SHINING MEMORY - INVITATION</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #fff3b0 0%, #d4af37 40%, #8a6d3b 100%);
            --navy-dark: #00040a;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--navy-dark);
            color: #fff;
            font-family: "Times New Roman", "Hiragino Mincho ProN", serif;
            -webkit-font-smoothing: antialiased;
        }

        .stars-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, #1a3a5a 0%, #00040a 100%);
            z-index: -1;
        }

        section {
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 60px 10px; box-sizing: border-box; text-align: center;
        }

        h2 {
            font-size: 1.6rem; color: var(--gold);
            letter-spacing: 0.3em; margin-bottom: 20px;
            border-bottom: 1px solid var(--gold);
            display: inline-block; padding-bottom: 5px;
        }

        /* --- 席次表エリア：横スワイプ強制設定 --- */
        .seating-wrapper {
            width: 100%;
            overflow-x: auto; /* 横スワイプを許可 */
            -webkit-overflow-scrolling: touch;
            padding: 20px 0;
        }

        /* 5列（2+1+2）を維持するためのコンテナ */
        .seating-container {
            display: grid;
            grid-template-columns: 200px 100px 200px; /* 左2列・中1列・右2列の幅固定 */
            gap: 15px;
            margin: 0 auto;
            width: max-content; /* 中身の幅に合わせて広がる */
            padding: 0 20px;
        }

        .screen-area {
            width: 530px; /* テーブル全体の幅に合わせる */
            border: 1px solid var(--gold);
            padding: 10px; margin: 0 auto 30px;
            font-size: 0.8rem; color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        /* 各ブロックのグリッド設定 */
        .grid-block {
            display: grid;
            gap: 10px;
        }
        .side-block { grid-template-columns: 1fr 1fr; } /* 左右は2列 */
        .center-block { grid-template-columns: 1fr; }   /* 中央は1列 */

        /* テーブルカードのデザイン（画像に合わせる） */
        .table-card {
            background: rgba(255, 255, 255, 0.02);
            border: 0.5px solid rgba(212, 175, 55, 0.4);
            padding: 12px 5px;
            border-radius: 4px;
            min-width: 90px;
        }

        .table-name {
            font-size: 0.75rem;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: bold;
            border-bottom: 0.5px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 4px;
        }

        .member-names {
            font-size: 0.7rem;
            color: #ffffff;
            letter-spacing: 0.05em;
        }

        /* スマホ向け注釈 */
        .scroll-hint {
            font-size: 0.7rem;
            color: var(--gold);
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 600px) {
            .scroll-hint { display: block; }
        }
    </style>
</head>
<body>

<div class="stars-bg"></div>

<section>
    <h2>SEATING LIST</h2>
    
    <div class="seating-wrapper">
        <div class="screen-area">SCREEN / STAGE</div>
        
        <div class="seating-container">
            
            <div class="grid-block side-block">
                <div class="table-card"><div class="table-name">バラ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">藤</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ダリア</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">デイジー</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">タンポポ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ユリ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">アヤメ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">スミレ</div><div class="member-names">氏名</div></div>
            </div>

            <div class="grid-block center-block">
                <div class="table-card"><div class="table-name">蓮</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">梅</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ポピー</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ネモフィラ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ヒマワリ</div><div class="member-names">氏名</div></div>
            </div>

            <div class="grid-block side-block">
                <div class="table-card"><div class="table-name">カスミソウ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ガーベラ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">カーネーション</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ミモザ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ルピナス</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">アネモネ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">チューリップ</div><div class="member-names">氏名</div></div>
                <div class="table-card"><div class="table-name">ハナミズキ</div><div class="member-names">氏名</div></div>
            </div>

        </div>
    </div>
    <div class="scroll-hint">← 左右にスワイプして全体を確認できます →</div>
</section>

</body>
</html>
